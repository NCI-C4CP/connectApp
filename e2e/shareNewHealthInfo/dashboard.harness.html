<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard HCS acceptance harness</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/lib/bootstrap.min.css">
</head>
<body>
    <div id="root"></div>
    <script type="module">
        import { renderDashboard } from '/js/pages/dashboard.js';

        window.__renderDashboard = async () => {
            window.__DASHBOARD_RENDERED__ = false;
            window.__DASHBOARD_ERROR__ = null;
            document.getElementById('root').innerHTML = '';
            try {
                await renderDashboard(window.__DASHBOARD_DATA__, false, []);
                window.__DASHBOARD_RENDERED__ = true;
            } catch (err) {
                window.__DASHBOARD_ERROR__ = String((err && err.stack) || err);
                console.error('[dashboard harness] render error', err);
            }
        };

        await window.__renderDashboard();
    </script>
</body>
</html>
