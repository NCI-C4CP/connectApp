name: Tests

on:
  pull_request:
    branches: [ dev, stage, master ]
  push:
    branches: [ dev, stage, master ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout pinned Quest integration source
        uses: actions/checkout@v4
        with:
          repository: episphere/quest-dev
          ref: 982f24ddc133d2e0153b792521da0af4c769b0b9
          path: .cache/quest-integration

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npm run test:e2e:install

      - name: Run Playwright E2E
        run: npm run test:e2e
